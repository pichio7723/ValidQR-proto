services:
  db:
    image: postgres:16
    container_name: validqr_db
    restart: always
    environment:
      POSTGRES_USER: adminvalidqr
      POSTGRES_PASSWORD: validqr123
      POSTGRES_DB: validqr_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: validqr_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: validqr_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://adminvalidqr:validqr123@db:5432/validqr_db
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

volumes:
  postgres_data: